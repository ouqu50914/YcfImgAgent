# 运行用户
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# 必须要有 events 块
events {
    worker_connections 1024;
}

# 必须要有 http 块，你的配置都在这里面
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include /etc/nginx/conf.d/*.conf;

    # ================= 宿主机反向代理（与 docker-compose.prod 配套）=================
    # 使用方式：复制本 server 块到 /etc/nginx/conf.d/ycf.conf，或 include 本文件到 http 块
    # 前端：127.0.0.1:8080  后端：127.0.0.1:3000
    # 质检 qc_web 仅 Docker 内网（qc_web:8082），Nginx 无需反代 8082
    # /api 长超时同时覆盖生图与 AI 质检（约 1–3 分钟）
    # ============ HTTP：仅 ACME 验证 + 全站跳转 HTTPS ============
    # 说明：80 端口只用于 Let's Encrypt 申请/续期证书，以及把 HTTP 流量 301 跳到 HTTPS。
    #       如果暂时不想强制跳转（比如证书还没好，先用 HTTP 访问），把下面 location / 的 return 行注释掉即可。
    server {
        listen       80;
        server_name  artycf.com www.artycf.com;

        # Certbot 验证目录（需提前建好：mkdir -p /var/www/certbot）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其余请求一律跳 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============ HTTPS：业务主入口（修复 https 打不开的问题）============
    server {
        listen       443 ssl;
        server_name  artycf.com www.artycf.com;

        # SSL 证书路径（Let's Encrypt 示例；若用腾讯云免费证书，改成下载的 fullchain.pem / privkey.pem 实际路径）
        ssl_certificate     /etc/letsencrypt/live/artycf.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/artycf.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 100M;

        # 后端 API（优先匹配，避免被前端吞掉）
        # 须关闭缓冲，否则 SSE（如 /api/notifications/admin/stream）会被攒包，浏览器长时间收不到数据
        location /api {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout   86400s;
            proxy_send_timeout   86400s;
        }

        # 上传文件 / 静态资源（COS 为 302 预签名，禁止缓存 Location）
        location /uploads {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache off;
            add_header Cache-Control "no-store" always;
        }

        # 健康检查（可选）
        location /health {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
        }

        # 前端 SPA（其余请求走前端容器；/agent/ 由前端容器内 nginx 的 location /agent/ 处理）
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    # ================= 配置结束 =================
}